server.port=8082
spring.application.name=ms-recursos-colaboraciones

spring.datasource.url=jdbc:mysql://localhost:3306/db_recursos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Secreto para validar los JWT (debe coincidir con el de ms-autenticacion).
# En produccion SIEMPRE definir la variable de entorno JWT_SECRET (via Secret
# de Kubernetes); el default es solo para dev local.
jwt.secret=${JWT_SECRET:EstaEsUnaClaveSecretaMuyLargaParaPoderFirmarElTokenJwtInnovatech2026}

# Actuator - Health checks para EKS
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
