# Secretos de la aplicacion, en base64. NO commitear valores reales.
# (En CI/CD este Secret lo crea el workflow deploy.yml desde GitHub Secrets;
#  este archivo es la referencia para aplicarlo a mano.)
#
# - SPRING_DATASOURCE_PASSWORD: password del usuario "admin" de RDS. Debe
#   coincidir con $env:INNOVATECH_DB_PASSWORD usado en infra/rds/setup-rds.ps1.
# - JWT_SECRET: secreto para firmar/validar los JWT (ms-autenticacion y
#   ms-gestion-proyectos). Minimo 32 caracteres.
#
# Generar un valor en base64 (PowerShell):
#   [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("<valor>"))
apiVersion: v1
kind: Secret
metadata:
  name: innovatech-secret
  namespace: innovatech
type: Opaque
data:
  SPRING_DATASOURCE_PASSWORD: "<BASE64_DB_PASSWORD>"
  JWT_SECRET: "<BASE64_JWT_SECRET>"
