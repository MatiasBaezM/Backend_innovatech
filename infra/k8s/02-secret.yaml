# Password del usuario "admin" de RDS, en base64. NO commitear un valor real.
# Debe coincidir con $env:INNOVATECH_DB_PASSWORD usado en infra/rds/setup-rds.ps1.
# Generar el valor en base64 (PowerShell):
#   [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($env:INNOVATECH_DB_PASSWORD))
apiVersion: v1
kind: Secret
metadata:
  name: innovatech-secret
  namespace: innovatech
type: Opaque
data:
  SPRING_DATASOURCE_PASSWORD: "<BASE64_DB_PASSWORD>"
