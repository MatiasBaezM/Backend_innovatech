apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-autenticacion
  namespace: innovatech
  labels:
    app: ms-autenticacion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-autenticacion
  template:
    metadata:
      labels:
        app: ms-autenticacion
    spec:
      containers:
        - name: ms-autenticacion
          image: ${ECR_REGISTRY}/innovatech/ms-autenticacion:${IMAGE_TAG}
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: innovatech-config
            - secretRef:
                name: innovatech-secret
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: innovatech-config
                  key: AUTENTICACION_DB_URL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
---
