apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: innovatech-cluster
  region: us-east-1
  version: "1.31"

iam:
  serviceRoleARN: arn:aws:iam::147318157574:role/LabRole

vpc:
  id: vpc-0eb34b49b01219b10
  subnets:
    public:
      us-east-1a: { id: subnet-07cd81458d452462f }
      us-east-1b: { id: subnet-011fd192a2e7971fd }

managedNodeGroups:
  - name: ng-1
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 20
    privateNetworking: false
    iam:
      instanceRoleARN: arn:aws:iam::147318157574:role/LabRole
