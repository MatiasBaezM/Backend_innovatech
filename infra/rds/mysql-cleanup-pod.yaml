apiVersion: v1
kind: Pod
metadata:
  name: mysql-cleanup
  namespace: innovatech
spec:
  restartPolicy: Never
  containers:
    - name: mysql
      image: mysql:8.0
      command: ["sleep", "1800"]
      env:
        # La contrasena se inyecta desde el Secret; nunca se imprime.
        - name: DB_PWD
          valueFrom:
            secretKeyRef:
              name: innovatech-secret
              key: SPRING_DATASOURCE_PASSWORD
