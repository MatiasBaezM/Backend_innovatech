name: Deploy to AWS (ECR + EKS)

on:
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: innovatech-cluster
  NAMESPACE: innovatech

jobs:
  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: ms-api_gateway
            repo: innovatech/ms-api-gateway
          - service: ms-autenticacion
            repo: innovatech/ms-autenticacion
          - service: ms-recursos_colaboraciones
            repo: innovatech/ms-recursos-colaboraciones
          - service: ms-gestion_proyectos
            repo: innovatech/ms-gestion-proyectos
          - service: ms-analiticas
            repo: innovatech/ms-analiticas

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPO: ${{ matrix.repo }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPO:$IMAGE_TAG" -t "$REGISTRY/$REPO:latest" "./${{ matrix.service }}"
          docker push "$REGISTRY/$REPO:$IMAGE_TAG"
          docker push "$REGISTRY/$REPO:latest"

  deploy:
    name: Deploy to EKS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Apply namespace, configmap and services
        run: |
          kubectl apply -f infra/k8s/00-namespace.yaml
          kubectl apply -f infra/k8s/01-configmap.yaml
          kubectl apply -f infra/k8s/04-services.yaml

      - name: Apply DB credentials secret
        run: |
          kubectl create secret generic innovatech-secret \
            -n "$NAMESPACE" \
            --from-literal=SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy microservices
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ECR_REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          export ECR_REGISTRY IMAGE_TAG
          envsubst < infra/k8s/03-deployments.yaml | kubectl apply -f -

      - name: Wait for rollout
        run: |
          for d in ms-autenticacion ms-recursos-colaboraciones ms-gestion-proyectos ms-analiticas ms-api-gateway; do
            kubectl rollout status "deployment/$d" -n "$NAMESPACE" --timeout=180s
          done
