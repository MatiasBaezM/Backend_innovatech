name: Deploy to AWS (ECR + EKS)

on:
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: innovatech-cluster
  NAMESPACE: innovatech

jobs:
  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: ms-api_gateway
            repo: innovatech/ms-api-gateway
          - service: ms-autenticacion
            repo: innovatech/ms-autenticacion
          - service: ms-recursos_colaboraciones
            repo: innovatech/ms-recursos-colaboraciones
          - service: ms-gestion_proyectos
            repo: innovatech/ms-gestion-proyectos
          - service: ms-analiticas
            repo: innovatech/ms-analiticas
          - service: ms-carta_gantt
            repo: innovatech/ms-carta-gantt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPO: ${{ matrix.repo }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPO:$IMAGE_TAG" -t "$REGISTRY/$REPO:latest" "./${{ matrix.service }}"
          docker push "$REGISTRY/$REPO:$IMAGE_TAG"
          docker push "$REGISTRY/$REPO:latest"

  deploy:
    name: Deploy to EKS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Apply namespace, configmap, secrets, services and deployments
        run: |
          kubectl apply -f infra/k8s/00-namespace.yaml
          kubectl apply -f infra/k8s/01-configmap.yaml
          kubectl apply -f infra/k8s/04-services.yaml
          kubectl apply -f infra/k8s/03-deployments.yaml

      - name: Apply application secrets
        run: |
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "::error::Falta configurar el secret JWT_SECRET en GitHub (Settings > Secrets > Actions). Genera uno con: openssl rand -base64 48"
            exit 1
          fi
          kubectl create secret generic innovatech-secret \
            -n "$NAMESPACE" \
            --from-literal=SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Point deployments at the freshly pushed images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ECR_REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          declare -A IMAGES=(
            [ms-autenticacion]=innovatech/ms-autenticacion
            [ms-recursos-colaboraciones]=innovatech/ms-recursos-colaboraciones
            [ms-gestion-proyectos]=innovatech/ms-gestion-proyectos
            [ms-analiticas]=innovatech/ms-analiticas
            [ms-carta-gantt]=innovatech/ms-carta-gantt
            [ms-api-gateway]=innovatech/ms-api-gateway
          )
          for deployment in "${!IMAGES[@]}"; do
            repo="${IMAGES[$deployment]}"
            kubectl set image "deployment/$deployment" "$deployment=$ECR_REGISTRY/$repo:$IMAGE_TAG" -n "$NAMESPACE"
          done

      - name: Wait for rollout
        run: |
          for d in ms-autenticacion ms-recursos-colaboraciones ms-gestion-proyectos ms-analiticas ms-carta-gantt ms-api-gateway; do
            kubectl rollout status "deployment/$d" -n "$NAMESPACE" --timeout=180s
          done
